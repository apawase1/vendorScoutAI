# Symptom: the service is running out of headroom (about to get slow/fail,
# not there yet). Actionable: sustained high CPU utilization means it's time
# to raise max-instances or investigate a leak/regression — a momentary
# spike during startup is not.
displayName: "VendorScoutAI UI — CPU saturation"
combiner: OR
conditions:
  - displayName: "CPU utilization > 80% sustained for 10 minutes"
    conditionThreshold:
      filter: >
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="vendorscoutai-ui"
        AND metric.type="run.googleapis.com/container/cpu/utilizations"
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_MEAN
          crossSeriesReducer: REDUCE_MEAN
      comparison: COMPARISON_GT
      thresholdValue: 0.8
      duration: 600s
      trigger:
        count: 1
notificationChannels:
  - "${NOTIFICATION_CHANNEL}"
alertStrategy:
  autoClose: 86400s
documentation:
  mimeType: text/markdown
  content: |
    **Symptom:** the service is close to its resource ceiling — the next
    traffic bump is likely to cause real slowness or failures.

    **First steps:** check current `max-instances` vs actual instance count;
    raise the ceiling if you're near it, or profile for a regression if CPU
    usage has been trending up without a traffic increase to match.
