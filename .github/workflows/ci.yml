name: CI

# Runs on every push and PR — including forks — so it never needs cloud
# credentials. Deployment is a separate workflow (deploy.yml) gated to
# pushes on main, where secrets are actually available.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Guardrail unit tests (no API key required)
        run: pytest tests/test_security.py -v

      - name: Full pipeline test (skips automatically without GOOGLE_API_KEY)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: pytest tests/test_pipeline_stub.py -v

      - name: Lint (report only — doesn't fail the build yet)
        run: |
          pip install --quiet ruff
          ruff check . --exit-zero

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed — this job only proves the Dockerfile builds)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vendorscoutai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
