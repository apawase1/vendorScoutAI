name: Deploy to Cloud Run

# Fires only after CI (test + docker build) has gone green on main — never
# deploys code that didn't pass tests. See DEPLOY.md for the one-time GCP
# setup (Artifact Registry repo, service account, Secret Manager secrets)
# this workflow assumes already exists; it deploys, it doesn't provision.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}  # manual re-run from the Actions tab if ever needed

permissions:
  contents: read
  id-token: write  # only needed if you switch to Workload Identity Federation

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/vendorscoutai

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # Simplest path for a hackathon-timeline setup — see DEPLOY.md for
          # how to generate this. Workload Identity Federation (no long-lived
          # key) is the hardened alternative; swap this block for
          # `workload_identity_provider` + `service_account` if you set that up.
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- UI service ----
      # Config split: non-secret knobs via --set-env-vars, everything
      # sensitive (API keys, tokens, phone numbers, Redis URL with embedded
      # credentials) via --set-secrets pointing at Secret Manager. Nothing
      # environment-specific is in the image itself — only in these two flags.
      - name: Deploy UI service
        run: |
          gcloud run deploy vendorscoutai-ui \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances "${{ vars.UI_MIN_INSTANCES || 0 }}" \
            --max-instances "${{ vars.UI_MAX_INSTANCES || 3 }}" \
            --timeout 300 \
            --set-env-vars "SERVICE_ROLE=ui,VENDORSCOUT_STUB=${{ vars.VENDORSCOUT_STUB || '0' }},VENDORSCOUT_WHATSAPP_STUB=${{ vars.VENDORSCOUT_WHATSAPP_STUB || '0' }},GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }},META_GRAPH_VERSION=${{ vars.META_GRAPH_VERSION || 'v25.0' }},REPLY_TIMEOUT_SECONDS=${{ vars.REPLY_TIMEOUT_SECONDS || '180' }},LOG_LEVEL=${{ vars.LOG_LEVEL || 'INFO' }}" \
            --set-secrets "GOOGLE_API_KEY=GOOGLE_API_KEY:latest,META_ACCESS_TOKEN=META_ACCESS_TOKEN:latest,META_PHONE_NUMBER_ID=META_PHONE_NUMBER_ID:latest,VENDOR_WHATSAPP_TO=VENDOR_WHATSAPP_TO:latest,DEMO_PRIORITY_VENDOR_CONTACT=DEMO_PRIORITY_VENDOR_CONTACT:latest,DEMO_PRIORITY_VENDOR_NAME=DEMO_PRIORITY_VENDOR_NAME:latest,REDIS_URL=REDIS_URL:latest"

      # ---- Webhook service ----
      - name: Deploy webhook service
        run: |
          gcloud run deploy vendorscoutai-webhook \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances "${{ vars.WEBHOOK_MIN_INSTANCES || 0 }}" \
            --max-instances "${{ vars.WEBHOOK_MAX_INSTANCES || 3 }}" \
            --timeout 60 \
            --set-env-vars "SERVICE_ROLE=webhook,LOG_LEVEL=${{ vars.LOG_LEVEL || 'INFO' }}" \
            --set-secrets "META_VERIFY_TOKEN=META_VERIFY_TOKEN:latest,META_APP_SECRET=META_APP_SECRET:latest,REDIS_URL=REDIS_URL:latest"

      - name: Print service URLs
        run: |
          gcloud run services describe vendorscoutai-ui --region "${{ vars.GCP_REGION }}" --format="value(status.url)"
          gcloud run services describe vendorscoutai-webhook --region "${{ vars.GCP_REGION }}" --format="value(status.url)"
